name: Build FocusLock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "FocusLock v1.1.0 (Direct APK)"
          body: "Approved UI update with discipline quote, global 5-tap interceptor, and 0ms instant dismiss."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
