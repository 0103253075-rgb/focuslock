name: Build FocusLock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: ./android
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee ../build_error.txt
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            git config --global user.name "Build Bot"
            git config --global user.email "bot@github.com"
            git checkout -B build-error-log
            git add -f ../build_error.txt
            git commit -m "Capture build error log"
            git push origin build-error-log --force
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "FocusLock v1.1.0 (Direct APK)"
          body: "Approved UI update with discipline quote, global 5-tap interceptor, and 0ms instant dismiss."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
