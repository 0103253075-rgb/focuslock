name: Build FocusLock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APKs
        working-directory: ./android
        run: |
          set +e
          gradle assembleDebug --stacktrace 2>&1 | tee ../build_error.txt
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            git config --global user.name "Build Bot"
            git config --global user.email "bot@github.com"
            git checkout -B build-error-log
            git add -f ../build_error.txt
            git commit -m "Capture build error log"
            git push origin build-error-log --force
            exit 1
          fi

      - name: Prepare APKs for Distribution
        run: |
          mkdir -p release_apks
          cp android/app/build/outputs/apk/follower/debug/app-follower-debug.apk release_apks/FocusLock-Follower-Edition.apk
          cp android/app/build/outputs/apk/creator/debug/app-creator-debug.apk release_apks/FocusLock-Creator-Pro.apk

      - name: Upload Follower Edition Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Follower-Edition
          path: release_apks/FocusLock-Follower-Edition.apk

      - name: Upload Creator Edition Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusLock-Creator-Pro
          path: release_apks/FocusLock-Creator-Pro.apk

      - name: Publish Direct Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.5
          name: "FocusLock v1.2.5 (Configured for Live Render Cloud)"
          body: |
            ### 🚀 FocusLock v1.2.5 Release:
            - **Default Cloud Host Configured:** Automatically connects to your live Render server `focuslock-7pe7.onrender.com`.
            - **Zero Setup for Followers:** Followers only need to enter their 4-digit code (`5091`)!
            - **Creator Pro & Follower Editions:** Ready to download.
          files: |
            release_apks/FocusLock-Follower-Edition.apk
            release_apks/FocusLock-Creator-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
